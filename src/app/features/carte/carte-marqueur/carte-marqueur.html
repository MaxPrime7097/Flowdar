<button
  type="button"
  (click)="selectionner.emit(alerte())"
  class="flex shrink-0 items-center gap-2 rounded-full border border-border bg-surface py-1 pl-1 pr-3 shadow-[0_1px_3px_rgba(0,0,0,0.08)]"
>
  <app-score-badge [score]="alerte().score" taille="petit" />
  <span class="text-[13px] font-semibold">{{ alerte().nom_quartier }}</span>
</button>
