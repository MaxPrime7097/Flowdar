<button
  type="button"
  (click)="selectionner.emit(alerte())"
  class="flex shrink-0 items-center gap-2 rounded-full px-4 py-2.5 shadow-md text-white text-[13px] font-bold"
  [class]="alerte().niveau === 'dangereux' ? 'bg-danger' : alerte().niveau === 'moyen' ? 'bg-warning' : 'bg-caution'"
>
  <app-icon
    [nom]="alerte().niveau === 'dangereux' ? 'alerte-dangereux' : alerte().niveau === 'moyen' ? 'alerte-moyen' : 'alerte-leger'"
    [taille]="14"
  />
  {{ alerte().nom_quartier }}
</button>
