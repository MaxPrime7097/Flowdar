<div class="fixed inset-x-0 bottom-16 z-20 rounded-t-2xl bg-surface p-4 shadow-2xl">
  <div class="flex items-start justify-between gap-3">
    <div class="flex items-center gap-3">
      <app-score-badge [score]="alerte().score" />
      <div>
        <p class="font-display text-lg font-bold">{{ alerte().nom_quartier }}</p>
        <p class="text-[13px] text-text-secondary">{{ alerte().heure_debut | tempsEcoule }}</p>
      </div>
    </div>
    <button type="button" (click)="fermer.emit()" class="text-text-muted" aria-label="Fermer">
      <app-icon nom="fermer" [taille]="20" />
    </button>
  </div>

  <div class="mt-3 flex items-center justify-between">
    <app-badge-niveau [niveau]="alerte().niveau" />
    <span class="text-[13px] text-text-secondary">{{ alerte().nb_confirmations }} confirmation(s)</span>
  </div>

  <a [routerLink]="['/alerte', alerte().id]" class="btn-primary mt-4 w-full">
    Voir le détail
  </a>
</div>
