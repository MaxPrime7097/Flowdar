<div [formGroup]="group()" class="space-y-6">

  <div>
    <label class="text-label mb-2 block uppercase text-text-secondary">Description de la situation</label>
    <textarea
      formControlName="description"
      rows="5"
      class="w-full resize-none rounded-2xl border border-border bg-surface p-4 text-[15px] outline-none focus:border-primary placeholder:text-text-muted"
      placeholder="Ex: égout bouché, hauteur de l'eau au genou, route impraticable..."
    ></textarea>
  </div>

  <div>
    <label class="text-label mb-2 block uppercase text-text-secondary">Photo (optionnel)</label>

    @if (apercuUrl(); as apercu) {
      <div class="relative overflow-hidden rounded-2xl border border-border">
        <img [src]="apercu" alt="Apercu" class="h-48 w-full object-cover" />
        <button
          type="button"
          (click)="photoChangee.emit(null)"
          class="absolute right-3 top-3 flex h-8 w-8 items-center justify-center rounded-full bg-text-primary/60 text-white backdrop-blur-sm"
          aria-label="Supprimer la photo"
        >
          <app-icon nom="fermer" [taille]="14" />
        </button>
      </div>
    } @else {
      <button
        type="button"
        (click)="ouvrirSelecteur()"
        class="flex w-full flex-col items-center gap-3 rounded-2xl border-2 border-dashed border-border bg-surface py-8 text-text-secondary transition-colors hover:bg-background"
      >
        <app-icon nom="appareil-photo" [taille]="32" />
        <span class="text-[14px] font-medium">Appuyer pour ajouter une photo</span>
        <span class="text-[12px] text-text-muted">JPG, PNG — max 5 Mo</span>
      </button>
    }

    <input
      #fichierInput
      type="file"
      accept="image/*"
      class="hidden"
      aria-label="Choisir une photo"
      (change)="onFichierChoisi($event)"
    />
  </div>

</div>
