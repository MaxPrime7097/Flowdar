<div class="space-y-3">
  <div class="flex h-2 w-full overflow-hidden rounded-full bg-[#F1F5F9]">
    @for (segment of segments(); track segment.label) {
      <div class="h-full" [class]="segment.couleur" [style.width.%]="segment.valeur"></div>
    }
  </div>

  <div class="grid grid-cols-2 gap-x-4 gap-y-2">
    @for (segment of segments(); track segment.label) {
      <div class="flex items-center gap-2 text-[13px]">
        <span class="h-2.5 w-2.5 shrink-0 rounded-full" [class]="segment.couleur"></span>
        <span class="text-text-secondary">{{ segment.label }} {{ segment.valeur }}/{{ segment.max }}</span>
      </div>
    }
  </div>
</div>
