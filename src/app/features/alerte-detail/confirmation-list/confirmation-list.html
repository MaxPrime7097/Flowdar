@if (confirmations().length === 0) {
  <p class="text-sm text-gray-400">Aucune confirmation pour le moment.</p>
} @else {
  <ul class="divide-y divide-gray-100">
    @for (confirmation of confirmations(); track confirmation.id) {
      <li class="flex items-center justify-between py-2 text-sm">
        <span>{{ confirmation.type === 'confirme' ? "C'est encore la" : "C'est passe" }}</span>
        <span class="text-gray-400">{{ confirmation.created_at | tempsEcoule }}</span>
      </li>
    }
  </ul>
}
