<div class="mx-auto flex min-h-screen max-w-sm flex-col justify-center p-6">
  <div class="mb-8 flex flex-col items-center">
    <span class="mb-3 flex h-16 w-16 items-center justify-center rounded-2xl bg-primary text-white shadow-sm">
      <app-icon nom="bouclier" [taille]="32" />
    </span>
    <h1 class="text-display text-primary">Flowdar</h1>
    <p class="mt-1 text-[13px] text-text-secondary">Detecte, alerte et guide</p>
  </div>

  <div class="rounded-card border border-border bg-surface p-5 shadow-sm">
    <div class="mb-6 flex rounded-button bg-background p-1">
      <button
        type="button"
        (click)="mode.set('login')"
        class="flex-1 rounded-[6px] py-2 text-[13px] font-semibold transition-colors"
        [class]="mode() === 'login' ? 'bg-surface text-primary shadow-[0_1px_3px_rgba(0,0,0,0.08)]' : 'text-text-secondary'"
      >
        Connexion
      </button>
      <button
        type="button"
        (click)="mode.set('inscription')"
        class="flex-1 rounded-[6px] py-2 text-[13px] font-semibold transition-colors"
        [class]="mode() === 'inscription' ? 'bg-surface text-primary shadow-[0_1px_3px_rgba(0,0,0,0.08)]' : 'text-text-secondary'"
      >
        Inscription
      </button>
    </div>

    @if (mode() === 'login') {
      <app-login />
    } @else {
      <app-register />
    }
  </div>

  <p class="mt-6 px-4 text-center text-[12px] text-text-muted">
    En continuant, vous acceptez nos <span class="underline">Conditions d'Utilisation</span> et notre
    <span class="underline">Politique de Confidentialite</span>.
  </p>
</div>
