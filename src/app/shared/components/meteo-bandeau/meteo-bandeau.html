@if (horsLigne()) {
  <div class="bg-primary px-4 py-2 text-center text-[13px] font-medium text-white">
    Donnees hors ligne — derniere mise a jour {{ derniereMaj() }}
  </div>
} @else if (pluieMmH() !== null) {
  <div
    class="inline-flex h-12 items-center gap-2 rounded-full border border-border/60 bg-surface/90 px-4 shadow-sm backdrop-blur-md"
  >
    <app-icon nom="nuage" [taille]="18" class="text-primary" />
    <span class="text-title text-text-primary">{{ pluieMmH() }}mm/h</span>
    <span class="h-4 w-px bg-border"></span>
    <span class="text-label text-text-secondary">{{ nomQuartier() }}</span>
  </div>
}
