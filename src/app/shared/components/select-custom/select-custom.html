<div class="relative">
  <button
    type="button"
    (click)="ouvert.set(!ouvert())"
    class="flex w-full items-center gap-3 rounded-2xl border-2 bg-surface px-4 py-3.5 text-left transition-colors"
    [class]="ouvert() ? 'border-primary' : 'border-border'"
  >
    <app-icon nom="localisation" [taille]="18" class="shrink-0 text-primary" />
    <span
      class="flex-1 text-[15px] font-medium"
      [class]="selectionne() ? 'text-text-primary' : 'text-text-muted'"
    >
      {{ selectionne()?.label ?? placeholder() }}
    </span>
    <app-icon
      nom="chevron-bas"
      [taille]="18"
      class="shrink-0 text-text-secondary transition-transform duration-200"
      [class]="ouvert() ? 'rotate-180' : ''"
    />
  </button>

  @if (ouvert()) {
    <div class="fixed inset-0 z-10" (click)="ouvert.set(false)"></div>

    <div class="absolute inset-x-0 top-full z-20 mt-2 max-h-52 overflow-y-auto rounded-2xl border border-border bg-surface shadow-xl [&::-webkit-scrollbar]:hidden">
      @for (option of options(); track option.valeur) {
        <button
          type="button"
          (click)="choisir(option)"
          class="flex w-full items-center gap-3 px-4 py-3.5 text-left text-[14px] transition-colors first:rounded-t-2xl last:rounded-b-2xl"
          [class]="estSelectionne(option.valeur) ? 'bg-primary text-white font-semibold' : 'text-text-primary hover:bg-background'"
        >
          <span class="flex-1">{{ option.label }}</span>
          @if (estSelectionne(option.valeur)) {
            <app-icon nom="check" [taille]="14" class="text-white" />
          }
        </button>
      }
    </div>
  }
</div>
