<nav class="fixed inset-x-0 bottom-0 z-10 flex h-16 items-center gap-1 border-t border-border bg-surface px-2 pb-[env(safe-area-inset-bottom)]">
  @for (onglet of onglets; track onglet.route) {
    <a
      #lien="routerLinkActive"
      [routerLink]="onglet.route"
      routerLinkActive
      [routerLinkActiveOptions]="{ exact: onglet.exact }"
      class="flex flex-1 flex-col items-center justify-center gap-0.5 rounded-full py-1.5 transition-colors"
      [class]="lien.isActive ? 'text-primary' : 'text-text-muted'"
    >
      <app-icon [nom]="onglet.icone" [taille]="22" [epaisseur]="lien.isActive ? 2.5 : 1.5" />
      <span class="text-[11px] font-semibold">{{ onglet.label }}</span>
    </a>
  }
</nav>
