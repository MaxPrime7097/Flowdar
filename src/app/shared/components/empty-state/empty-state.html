<div class="flex flex-col items-center gap-3 py-10 text-center">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-text-muted">
    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
    <circle cx="12" cy="10" r="3" />
  </svg>
  <p class="font-display font-semibold text-text-primary">{{ titre() }}</p>
  @if (description()) {
    <p class="max-w-xs text-[13px] text-text-secondary">{{ description() }}</p>
  }
  @if (labelAction()) {
    <button type="button" (click)="action.emit()" class="btn-secondary mt-1 h-10 px-4 text-[13px]">
      {{ labelAction() }}
    </button>
  }
</div>
